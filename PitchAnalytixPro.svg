<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#001B3D"/>
      <stop offset="1" stop-color="#000C1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Layer -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)"/>
  
  <!-- Data Chart Elements -->
  <rect x="140" y="240" width="30" height="80" rx="4" fill="#58FF63" opacity="0.4" />
  <rect x="185" y="200" width="30" height="120" rx="4" fill="#58FF63" opacity="0.6" />
  <rect x="230" y="160" width="30" height="160" rx="4" fill="#58FF63" opacity="0.8" />
  
  <!-- Rising Stats Wave -->
  <path d="M140 380C180 380 220 320 280 320C340 320 380 360 420 300" stroke="#58FF63" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Cricket Bat (Stylized) -->
  <g transform="rotate(-45 256 256)">
    <!-- Blade -->
    <rect x="216" y="140" width="80" height="240" rx="10" fill="#BCD2FE" fill-opacity="0.9" style="mix-blend-mode: overlay;"/>
    <rect x="216" y="140" width="80" height="240" rx="10" stroke="#58FF63" stroke-width="4" />
    <!-- Handle -->
    <rect x="246" y="60" width="20" height="80" rx="4" fill="#58FF63" />
    <path d="M246 100H266M246 115H266M246 85H266" stroke="#001B3D" stroke-width="2" />
  </g>
  
  <!-- Gloss Effect -->
  <path d="M400 100C300 50 100 150 112 400" stroke="white" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
</svg>